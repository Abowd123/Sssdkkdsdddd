name: Build ColorLand

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check coloring assets (closed paths, sizes, labels)
        run: |
          pip install shapely
          python tools/art/check_assets.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (keeps existing lib/, assets/, test/)
        run: flutter create . --platforms=android --org com.colorland --project-name colorland

      - name: App name, icon, splash color, kid-safe manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="colorland"/android:label="ColorLand"/' $M
          # Release build must never request internet (Families policy friendly).
          if grep -q "android.permission.INTERNET" $M; then sed -i '/android.permission.INTERNET/d' $M; fi
          # Saving to photos on Android 9 and older (the only extra permission).
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application#' $M
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp tools/icon/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          # Native launch screen in Lolo orange (no white flash).
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="splash">#FFB37A</color></resources>\n' > android/app/src/main/res/values/colors.xml
          for f in android/app/src/main/res/drawable*/launch_background.xml; do
            sed -i 's#<item android:drawable="?android:colorBackground" />#<item android:drawable="@color/splash" />#; s#<item android:drawable="@android:color/white" />#<item android:drawable="@color/splash" />#' $f
          done

      - name: Release signing (only if the KEYSTORE secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No keystore secret: using debug signing (fine for testing)."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
          G=$(ls android/app/build.gradle.kts 2>/dev/null || ls android/app/build.gradle)
          python3 tools/release/apply_signing.py "$G" upload.jks "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD"

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Build APKs (one per CPU type + universal)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Build App Bundle (for Google Play)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Size report
        run: ls -lh build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: colorland-apk
          path: build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: colorland-aab
          path: build/app/outputs/bundle/release/*.aab
